{% extends 'base.html' %}
{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-semibold">My Tasks</h4>
    <a href="{% url 'add_task' %}" class="btn btn-primary">+ New Task</a>
</div>

{% if tasks %}
    <div class="row g-3">
        {% for task in tasks %}
            <div class="col-md-6">
                <div class="card task-card">
                    <div class="card-body d-flex justify-content-between align-items-start">
                        <div>
                            {% if task.completed %}
                                <h6 class="text-decoration-line-through text-muted mb-1">
                                    {{ task.title }}
                                </h6>
                                <small class="text-success">Completed</small>
                            {% else %}
                                <h6 class="mb-1">{{ task.title }}</h6>
                                <small class="text-warning">Pending</small>
                            {% endif %}
                        </div>

                        <div>
                            <a href="{% url 'update_task' task.id %}" class="btn btn-sm btn-outline-warning">✏️</a>
                            <a href="{% url 'delete_task' task.id %}" class="btn btn-sm btn-outline-danger">🗑️</a>
                        </div>
                    </div>
                </div>
            </div>
        {% endfor %}
    </div>
{% else %}
    <div class="text-center text-muted mt-5">
        <p>No tasks yet.</p>
    </div>
{% endif %}

{% endblock %}

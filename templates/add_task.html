{% extends 'base.html' %}
{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="mb-4 fw-semibold">
                    {% if task %}Update Task{% else %}Add Task{% endif %}
                </h5>

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" name="title" class="form-control"
                               value="{{ task.title|default:'' }}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control">{{ task.description|default:'' }}</textarea>
                    </div>

                    {% if task %}
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="completed"
                               {% if task.completed %}checked{% endif %}>
                        <label class="form-check-label">Completed</label>
                    </div>
                    {% endif %}

                    <div class="d-flex justify-content-end">
                        <a href="{% url 'home' %}" class="btn btn-light me-2">Cancel</a>
                        <button class="btn btn-primary">
                            {% if task %}Update{% else %}Add{% endif %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
